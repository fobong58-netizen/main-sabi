<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>report a customer | sabi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/listed.css">
    <link rel="stylesheet" href="/profile.css">
    <style>
        .page-report .nav-sub a[href="/listed.html"] button { background-color: transparent; color: var(--white); font-weight: 500; }
        .page-report .nav-sub a[href="/listed.html"] button:hover { background-color: rgba(255, 255, 255, 0.14); }
        .page-report .nav-sub a[href="/report.html"] button { background-color: var(--sun); color: var(--blue-deep); font-weight: 600; }
    </style>
</head>
<body class="page-report">
    <header>
        <nav class="nav-bar">
            <h1 class="logo">sabi</h1>
            <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="navMenu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <div class="nav-sub" id="navMenu">
                <a href="/index.html"><button>Find a service</button></a>
                <a href="/jobs.html"><button>Jobs</button></a>
                <a href="/listed.html"><button>Get listed</button></a>
                <a href="/profile.html"><button>My profile</button></a>
                <a href="/post-job.html"><button>Post a job</button></a>
                <a href="/feedback.html"><button>Feedback</button></a>
                <a href="/report.html"><button>Report a customer</button></a>
            </div>
        </nav>
    </header>
    <main>
        <div class="top-text">
            <h1>Report a customer</h1>
            <p>Only artisans can report. You can report a customer who contacted you through sabi. We read every report and may suspend the account.</p>
        </div>
        <div class="con">
            <form class="card" id="report-form">
                <div class="row-2">
                    <div class="field">
                        <label for="my-phone">Your WhatsApp number</label>
                        <input type="tel" id="my-phone" name="my_phone" placeholder="08012345678" inputmode="tel" pattern="(0|\+?234)[789][01][0-9]{8}" title="Enter a valid Nigerian number, e.g. 08012345678" required>
                    </div>
                    <div class="field">
                        <label for="my-pin">Your PIN</label>
                        <input type="password" id="my-pin" name="pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="current-password" title="Your 6-digit PIN" required>
                    </div>
                </div>
                <div class="field">
                    <label for="cust-phone">Customer's phone number</label>
                    <input type="tel" id="cust-phone" name="cust_phone" placeholder="08012345678" inputmode="tel" pattern="(0|\+?234)[789][01][0-9]{8}" title="Enter a valid Nigerian number, e.g. 08012345678" required>
                    <p class="hint">The number the customer called or messaged you from.</p>
                </div>
                <div class="field">
                    <label for="reason">What happened?</label>
                    <select id="reason" name="reason" required>
                        <option value="" disabled selected>Choose one</option>
                        <option>Harassment</option>
                        <option>Abuse or insults</option>
                        <option>Fraud or scam</option>
                        <option>Fake job or no-show</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="field-work">
                    <label for="details">Details <span class="optional">(optional)</span></label>
                    <textarea id="details" name="details" rows="5" maxlength="600" placeholder="Tell us what happened and when."></textarea>
                </div>
                <p id="msg" class="msg" role="status"></p>
                <button type="submit" class="submit-btn">Send report</button>
            </form>
        </div>
    </main>
    <footer>
        <p>sabi | Skilled workers in Port Harcourt</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/nav.js"></script>
    <script src="report.js"></script>
</body>
</html>
